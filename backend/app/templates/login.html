{% extends "base.html" %}
{% block title %}Connexion enseignant{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Espace enseignant</h1>
    <p class="muted">Connectez-vous pour gérer le planning.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login" class="vform">
        <label>
            Identifiant
            <input type="text" name="username" required autocomplete="username" autofocus>
        </label>
        <label>
            Mot de passe
            <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn-primary btn-wide">Se connecter</button>
    </form>
</section>
{% endblock %}
