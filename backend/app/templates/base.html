<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="RDV École">
    <meta name="format-detection" content="telephone=no">
    <title>{% block title %}Rendez-vous parents{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand">
            <span class="logo">📚</span>
            <span>Rendez-vous parents</span>
        </a>
        <nav>
            <button type="button" id="pwaInstallBtn" class="nav-link install-btn" hidden title="Installer l'application sur cet appareil">📲 Installer</button>
            {% if user %}
                <a href="/admin" class="nav-link">{% if user.is_super_admin %}Direction{% else %}Mon planning{% endif %}</a>
                <form action="/admin/logout" method="post" class="inline-form">
                    <button type="submit" class="link-btn">Se déconnecter</button>
                </form>
            {% else %}
                <a href="/admin/login" class="nav-link nav-discreet">Espace enseignant</a>
            {% endif %}
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <small>Application de prise de rendez-vous parents-enseignant</small>
    </footer>
    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
